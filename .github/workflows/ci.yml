name: ci-cd

on:
  push:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python for testing
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Step 3: Install dependencies for the backend
      - name: Install deps
        run: pip install -r phishing-detector/backend/requirements.txt

      # Step 4: Start the backend server in the background
      - name: Start backend server
        run: |
          cd phishing-detector/backend
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 5 # Wait for server to start
        env:
          SAFE_BROWSING_KEY: ${{ secrets.SAFE_BROWSING_KEY }}

      # Step 5: Run our tests to verify the code works
      - name: Run smoke tests
        run: python phishing-detector/backend/smoke_test.py
        env:
          PYTHONIOENCODING: utf-8

  build-and-push:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Authenticate with Docker Hub using secrets
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 3: Build and push the backend container image
      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./phishing-detector/backend
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/securelens-backend:latest
          push: true

      # Step 4: Build and push the frontend container image
      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./safelink-frontend
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/securelens-frontend:latest
          push: true

  notify:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      # Print success message for deployment readiness
      - name: Print success
        run: |
          echo "✅ CI complete. Images pushed to Docker Hub."
          echo "🔗 Backend: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/securelens-backend:latest"
          echo "🔗 Frontend: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/securelens-frontend:latest"
          echo "🚀 Jenkins will now handle deployment."
